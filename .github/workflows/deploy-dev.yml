# deploy-dev (owner: T00, then the lead). BUILD_PLAN §8, §9; SETUP_FOR_FOUNDER Step 2.1.
#
# MANUAL ONLY. It needs founder secrets that do not exist yet. Until the founder
# creates the `plinth-dev` Supabase project and adds these GitHub Actions secrets
# (`gh secret set NAME` in their own terminal), this workflow stops at the first step:
#   SUPABASE_ACCESS_TOKEN   CI access token (Account -> Access tokens)
#   SUPABASE_PROJECT_REF    plinth-dev project ref
#   SUPABASE_DB_PASSWORD    plinth-dev database password
# Do not add a push or schedule trigger: the lead enables automatic deploys later.
# Vercel deploys web and admin through its own Git integration, not from here.
#
# What it does: link -> db push (migrations) -> functions deploy -> optional seed reset.
# plinth-dev is the frozen §5b "fixture world" (plinth.env = 'fixture', clock 18 Oct 2026).
name: deploy-dev

on:
  workflow_dispatch:
    inputs:
      reset_seed:
        description: "Reset plinth-dev to the §5b seed (DESTROYS all dev data)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to plinth-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the founder's secrets exist
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. See docs/engineering/SETUP_FOR_FOUNDER.md Step 2.1."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Link plinth-dev
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy edge functions
        run: |
          if find supabase/functions -mindepth 2 -name index.ts -not -path '*/_shared/*' | grep -q .; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "::notice::No edge functions yet."
          fi
      - name: Reset the §5b seed (fixture world)
        if: inputs.reset_seed
        run: supabase db reset --linked --password "$SUPABASE_DB_PASSWORD"
