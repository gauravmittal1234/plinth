# Published history before the v1.2 recalculation of 14 Oct 2026: the fixture world's
# core.score_runs and core.band_notices rows (DESIGN §5b band history; C-17, C-24).
#
# A published run is a record. The engine never rewrites one: it reads these to chain
# `supersedes`, decide notices for the next run and extend band history, and it derives
# their ids, statuses and frequencies itself. Their bands are not re-computed because the
# point-in-time inputs behind them are not all in the canonical facts (complaint counts are
# one fact as of 9 Oct 2026, C-11; Sapphire's first QPR on record is Apr-Jun 2026), so a
# replay could not tell 2 Sep (Moderate) from 30 Sep (Elevated). `plinth-pipe score
# --replay-audit` shows what each model would say on the facts that are on record.
#
# `source` is the run's provenance; `history_source` is its band-history row's.
