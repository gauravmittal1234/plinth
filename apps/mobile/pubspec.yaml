name: plinth
description: "Plinth: buyer-side home-buying checks for Gurugram (Android, R1)."
publish_to: 'none'

# versionName+versionCode. Bump the build number for every Play upload.
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Dependency lines are FROZEN after T00 (WORK_BREAKDOWN §1 rule 2): only the
# lead's integrator PR adds, removes or bumps one. Versions follow the founder's
# Thapki app (~/code/pet_app/app/pubspec.yaml) where the package is shared, so
# the same proven set runs on the same Flutter 3.47.5 / Dart 3.13.4 toolchain.
dependencies:
  flutter:
    sdk: flutter

  # State and navigation (pet_app: lib/data/session.dart, lib/app.dart).
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Backend: Supabase (api schema RPCs + edge functions). An empty SUPABASE_URL
  # means FIXTURES mode; there are no hard-coded defaults.
  supabase_flutter: ^2.17.2

  # Offline: SyncQueue replay (shared_preferences) and the JSON payload cache.
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Push and crash reports, wrapped so the app always opens without Firebase.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0

  # Claims via the share sheet, cost-sheet and flyer capture.
  share_handler: ^0.0.25
  google_mlkit_document_scanner: ^0.6.1
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # Voice (Ask Plinth) and read-aloud (Simple view).
  # Pinned (kept from pet_app): 7.5.0's Android side drops `contextualPhrases`;
  # 7.6.0-beta.4 passes them as EXTRA_BIASING_STRINGS on Android 13+, and
  # cancel() no longer breaks the next listen. Its other changes are iOS-only.
  speech_to_text: 7.6.0-beta.4
  flutter_tts: ^4.2.5

  # Where am I?, permissions, sharing cards, links.
  geolocator: ^14.1.1
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

  # Drawing, motion, formatting, ids.
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  uuid: ^4.6.0

  # New for Plinth (BUILD_PLAN §5.3): RERA QR codes, on-device pre-OCR, and
  # MapLibre on the same PMTiles + style as the web (no Google Maps billing).
  mobile_scanner: ^7.4.2
  google_mlkit_text_recognition: ^0.17.1
  maplibre_gl: ^0.27.1

  # Shared packages generated in this repo (placeholders until T01, T02, T03).
  plinth_tokens:
    path: ../../packages/tokens/dart
  plinth_contracts:
    path: ../../packages/contracts/dart
  plinth_fixtures:
    path: ../../packages/fixtures/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # OFL fonts bundled for an offline first launch (AGENTS.md §4, PlinthType in
  # packages/tokens/dart, AppTheme). Sources and licence: assets/fonts/README.md.
  # FOUNDER_QUESTIONS P10: Figtree for all text, buttons and labels; Bricolage
  # Grotesque at 700 for display, title and section only; Noto Sans for Hindi.
  # Both variable fonts get their weight from the 'wght' axis (AppTheme).
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree-Variable.ttf
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/bricolage-grotesque/BricolageGrotesque-Variable.ttf
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/noto-sans/NotoSans-Variable.ttf

  # Illustrative project pictures (the web's home assets), matched to a
  # payload's image_url by file name (core/widgets/media/project_image.dart).
  assets:
    - assets/images/projects/
